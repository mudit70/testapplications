# Answers for 40-ts-reactive-refetch, written from the code (not from any analyzer's output).
# Format and labels: veoagents docs/development/harness.md.
app: 40-ts-reactive-refetch
source: testapplications
kind: fixture
notes: >
  A Vue front end (web) whose listing fetches again when reactive state changes, and the Express
  API (api) it calls. Files.vue watches the file store's reload (through storeToRefs) and sort
  (through a getter); its reload watcher runs fetchData only for a true value. Copy and Refresh
  set reload = true, Cancel sets it false, and the sort menu writes sort through
  mapWritableState. The deployments are a TanStack DB collection loaded through TanStack Query:
  Redeploy invalidates its key, and Refresh deployments refetches the collection itself.

nodes:
  APIEndpoint:
    - GET /api/resources
    - POST /api/copy
    - POST /api/cancel
    - GET /api/deployments
    - POST /api/deployments/{id}/redeploy

edges:
  HANDLED_BY:
    - "GET /api/resources -> api/src/server.ts#app.get('/api/resources')"
    - "POST /api/copy -> api/src/server.ts#app.post('/api/copy')"
    - "POST /api/cancel -> api/src/server.ts#app.post('/api/cancel')"
    - "GET /api/deployments -> api/src/server.ts#app.get('/api/deployments')"
    - "POST /api/deployments/{id}/redeploy -> api/src/server.ts#app.post('/api/deployments/:id/redeploy')"

flows:
  - name: copy
    element: web/src/components/Toolbar.vue:Toolbar:button:click#1
    pattern: a store flag a watcher of it fetches on
    endpoints: [POST /api/copy, GET /api/resources]
  - name: cancel
    element: web/src/components/Toolbar.vue:Toolbar:button:click#2
    pattern: a value of the flag the watcher skips
    endpoints: [POST /api/cancel]
  - name: refresh
    element: web/src/components/Toolbar.vue:Toolbar:button:click#3
    pattern: an options store's action that sets the flag
    endpoints: [GET /api/resources]
  - name: sort by size
    element: web/src/components/SortMenu.vue:SortMenu:select:change#1
    pattern: a field written through mapWritableState, watched through a getter
    endpoints: [GET /api/resources]
  - name: redeploy
    element: web/src/components/Deployments.vue:Deployments:button:click#1
    pattern: an invalidated query key a TanStack DB collection loads by
    endpoints: ["POST /api/deployments/{id}/redeploy", GET /api/deployments]
  - name: refresh deployments
    element: web/src/components/Deployments.vue:Deployments:button:click#2
    pattern: a TanStack DB collection refetched
    endpoints: [GET /api/deployments]
