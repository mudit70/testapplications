# Answers for 48-ts-store-callbacks, written from the code (not from any analyzer's output).
# Format and labels: veoagents docs/development/harness.md.
app: 48-ts-store-callbacks
source: testapplications
kind: fixture
notes: >
  A Vue + Pinia front end (web) and the Express API (api) it calls. Confirmation prompts run a
  callback kept in the layout store: an opener calls showHover({ prompt, confirm }), the action
  pushes the record into state.prompts, the currentPrompt getter returns the last one, and the
  prompt's button calls currentPrompt.confirm(): from a method (ShareDelete, mapState), from its
  template (DeleteUser, layoutStore.currentPrompt?.confirm) and from a script setup destructure
  (CurrentPassword). Prompts.vue maps each prompt name to its component, so each prompt runs only
  the callbacks stored under its own name. The openers themselves request nothing.

nodes:
  APIEndpoint:
    - "DELETE /api/share/{hash}"
    - "DELETE /api/users/{id}"
    - "PUT /api/users/{id}"

edges:
  HANDLED_BY:
    - "DELETE /api/share/{hash} -> api/src/server.ts#app.delete('/api/share/:hash')"
    - "DELETE /api/users/{id} -> api/src/server.ts#app.delete('/api/users/:id')"
    - "PUT /api/users/{id} -> api/src/server.ts#app.put('/api/users/:id')"

flows:
  - name: confirm share delete
    element: web/src/prompts/ShareDelete.vue:ShareDelete:button:click#1
    pattern: a stored callback called from a method through a mapped getter
    endpoints: ["DELETE /api/share/{hash}"]
  - name: confirm user delete
    element: web/src/prompts/DeleteUser.vue:DeleteUser:button:click#1
    pattern: a stored callback named in the template
    endpoints: ["DELETE /api/users/{id}"]
  - name: confirm password
    element: web/src/prompts/CurrentPassword.vue:CurrentPassword:form:submit#1
    pattern: a stored callback through a destructured getter
    endpoints: ["PUT /api/users/{id}"]
  - name: open share delete
    element: web/src/views/Shares.vue:Shares:button:click#1
    pattern: an opener that only stores the callback
    endpoints: []
