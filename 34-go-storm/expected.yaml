# Answers for 34-go-storm, written from the code (not from any analyzer's output).
# Format and labels: veoagents docs/development/harness.md.
app: 34-go-storm
source: testapplications
kind: fixture
notes: >
  React + net/http (Go 1.22 patterns) + BoltDB through storm (backend/store/store.go), shaped
  like filebrowser's storage/bolt. storm keeps each struct in a bucket named after its type:
  One, a Select(q…).Find and DeleteStruct work on the struct their argument holds (User,
  Bookmark), Save on the one it is given. Get and Set work on the key-value bucket they name
  ("settings"). From("team").Save writes the Bookmark bucket below the team bucket
  (team/Bookmark, not Bookmark), and a query's Bucket("archive") reads the archive bucket.
  POST /api/check probes the URL the user gives (http.Get of a form value: known only when the
  code runs, so an Unknown) and posts an event to eventsURL(): EVENTS_URL when set
  (configuration, Unknown), else the literal https://events.example.com, which the source states.

nodes:
  APIEndpoint:
    - GET /api/bookmarks
    - POST /api/bookmarks
    - "DELETE /api/bookmarks/{id}"
    - GET /api/theme
    - PUT /api/theme
    - POST /api/team/bookmarks
    - GET /api/archive
    - POST /api/check
  UIElement:
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#1
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#2
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#3
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#4
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#5
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#6
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#7
    - frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#8
  DataContainer: [User, Bookmark, settings, team/Bookmark, archive]
  ExternalSystem: [events.example.com]

edges:
  HANDLED_BY:
    - GET /api/bookmarks -> backend/main.go#server.list
    - POST /api/bookmarks -> backend/main.go#server.add
    - "DELETE /api/bookmarks/{id} -> backend/main.go#server.remove"
    - GET /api/theme -> backend/main.go#server.theme
    - PUT /api/theme -> backend/main.go#server.setTheme
    - POST /api/team/bookmarks -> backend/main.go#server.share
    - GET /api/archive -> backend/main.go#server.archived
    - POST /api/check -> backend/main.go#server.check
  READS:
    - backend/store/store.go#Store.UserByName -> User
    - backend/store/store.go#Store.Bookmarks -> Bookmark
    - backend/store/store.go#Store.Theme -> settings
    - backend/store/store.go#Store.Archived -> archive
  WRITES:
    - backend/store/store.go#Store.AddBookmark -> Bookmark
    - backend/store/store.go#Store.RemoveBookmark -> Bookmark
    - backend/store/store.go#Store.SetTheme -> settings
    - backend/store/store.go#Store.ShareBookmark -> team/Bookmark

flows:
  - name: load bookmarks
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#1
    pattern: struct bucket, storm query
    endpoints: [GET /api/bookmarks]
    data: [READS User, READS Bookmark]
  - name: add bookmark
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#2
    pattern: struct bucket, Save
    endpoints: [POST /api/bookmarks]
    data: [READS User, WRITES Bookmark]
  - name: remove bookmark
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#3
    pattern: struct bucket, DeleteStruct
    endpoints: ["DELETE /api/bookmarks/{id}"]
    data: [WRITES Bookmark]
  - name: load theme
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#4
    pattern: key-value bucket, Get
    endpoints: [GET /api/theme]
    data: [READS settings]
  - name: save theme
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#5
    pattern: key-value bucket, Set
    endpoints: [PUT /api/theme]
    data: [WRITES settings]
  - name: share with team
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#6
    pattern: a node's nested bucket (From)
    endpoints: [POST /api/team/bookmarks]
    data: [WRITES team/Bookmark]
  - name: load archive
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#7
    pattern: a query's named bucket (Bucket)
    endpoints: [GET /api/archive]
    data: [READS archive]
  - name: check link
    element: frontend/src/components/Bookmarks.tsx:Bookmarks:button:onClick#8
    pattern: outbound net/http calls, a literal default host
    endpoints: [POST /api/check]
    external: [events.example.com]
    unknowns: [call_target]
